<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ART native event transport test</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { margin: 24px; background: #10131a; color: #e8edf7; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 12px; }
    section { padding: 14px; border: 1px solid #30394a; border-radius: 8px; background: #171c26; }
    .value { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
    canvas { width: 100%; height: 220px; margin-top: 16px; background: #090b10; }
    pre { max-height: 260px; overflow: auto; white-space: pre-wrap; color: #aab6cc; }
  </style>
</head>
<body>
  <h1>ART native browser events</h1>
  <div class="grid">
    <section>Audio rate<div class="value" id="rate">0 Hz</div></section>
    <section>Last latency<div class="value" id="latency">-- ms</div></section>
    <section>Sequence gaps<div class="value" id="gaps">0</div></section>
    <section>BPM<div class="value" id="bpm">--</div></section>
    <section>Transport<div class="value" id="transport">--</div></section>
  </div>
  <canvas id="spectrum" width="1280" height="220"></canvas>
  <pre id="log">Waiting for events...</pre>
  <script src="art-client.js"></script>
  <script src="native-events-test.js"></script>
</body>
</html>
